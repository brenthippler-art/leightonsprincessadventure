<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No zooming, fills the whole screen including the iPad notch/rounded-corner area. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- Lets "Add to Home Screen" on iPad open it like an app with no browser bars. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#2a1438" />
    <!-- Home-screen app: name, crown icon, fullscreen + landscape (see public/manifest.webmanifest). -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Princess" />
    <!-- Inline favicon (a tiny pink crown) so the browser never asks for a file that isn't there. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Cpath fill='%23ff6fb5' d='M0 2h1v1h1V2h1V1h2v1h1v1h1V2h1v5H0z'/%3E%3Cpath fill='%23ffe066' d='M1 5h6v1H1z'/%3E%3C/svg%3E"
    />
    <title>Leighton's Princess Adventure</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* Dark purple letterbox around the game. */
        background: #2a1438;
        /* Stop page scrolling, rubber-banding, pinch-zoom, double-tap zoom. */
        position: fixed;
        inset: 0;
        overscroll-behavior: none;
        touch-action: none;
        /* Stop text selection, the long-press callout menu, and the grey tap flash. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      canvas {
        /* Keep pixels as crisp squares when the browser stretches the canvas. */
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
        outline: none;
      }

      /* "Please turn the tablet sideways" picture, only on touch screens held upright. */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        background: #2a1438;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }
      #rotate svg {
        width: 40vmin;
        height: 40vmin;
      }
      #rotate .device {
        transform-origin: 50px 50px;
        animation: turn 2.4s ease-in-out infinite;
      }
      @keyframes turn {
        0%, 25% { transform: rotate(0deg); }
        55%, 100% { transform: rotate(90deg); }
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate" aria-hidden="true">
      <!-- A tablet that turns sideways, plus a curved arrow. Pictures only, no words. -->
      <svg viewBox="0 0 100 100" shape-rendering="crispEdges">
        <g class="device">
          <rect x="32" y="18" width="36" height="64" rx="4" fill="#ff6fb5" />
          <rect x="36" y="24" width="28" height="50" fill="#ffe3f1" />
          <rect x="47" y="76" width="6" height="3" fill="#ffe3f1" />
        </g>
        <path d="M80 30 A34 34 0 0 1 84 62" stroke="#ffe066" stroke-width="5" fill="none" />
        <path d="M76 58 L84 70 L92 58 Z" fill="#ffe066" />
      </svg>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
